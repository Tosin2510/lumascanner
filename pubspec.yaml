name: lumascanner
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.12.0+2
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  path: ^1.9.1
  pdf: ^3.12.0
  share_plus: ^13.3.0
  printing: ^5.14.3
  image: ^4.10.1
  document_scan: ^0.3.1
  google_mlkit_text_recognition: ^0.17.1
  pdfx: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0D1118"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true